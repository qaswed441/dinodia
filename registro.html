<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinoDía · Registro</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#d9f2e6,#fdf6e3);color:#2d4a3e;min-height:100vh}
  .app{max-width:460px;margin:0 auto;padding:18px 14px 40px}
  h1{margin:4px 0 0;font-size:24px;color:#2f8f6b;text-align:center}
  h2{font-size:16px;margin:18px 0 8px}
  .nube{margin:4px 0 10px;font-size:12px;color:#6b8f80;text-align:center;min-height:15px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .nav button{width:44px;height:44px;border:0;border-radius:14px;background:#fff;color:#2f8f6b;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .nav button:disabled{opacity:.35}
  #mes{flex:1;text-align:center;font-size:18px;font-weight:bold;text-transform:capitalize}
  .sem,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .sem div{text-align:center;font-size:11px;color:#6b8f80;padding-bottom:3px}
  .dia{position:relative;aspect-ratio:.82;border-radius:12px;background:#fff;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;box-shadow:0 2px 5px rgba(0,0,0,.06);font-family:inherit;color:inherit}
  .dia .n{position:absolute;top:3px;left:5px;font-size:10px;color:#6b8f80}
  .dia .e{font-size:22px;line-height:1;margin-top:8px}
  .dia .ic{font-size:10px;line-height:1;margin-top:3px;min-height:11px;white-space:nowrap}
  .dia.fuera{visibility:hidden;box-shadow:none}
  .dia.falta{background:rgba(255,255,255,.45);box-shadow:none;border:2px dashed #cfe0d7}
  .dia.falta .e{color:#b9c9c0;font-size:18px}
  .dia.fut{background:transparent;box-shadow:none;opacity:.4}
  .dia.hoy{border-color:#e8833a}
  .dia.sel{border-color:#2f8f6b;transform:scale(1.07);z-index:2}
  .m0{background:#d3f3e0}.m1{background:#e5f6d6}.m2{background:#fcf1c8}.m3{background:#fddcc6}.m4{background:#f8cfcf}
  .leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:#6b8f80;margin-top:10px}
  .resumen{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .resumen .fila{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
  .resumen .fila b{color:#e8833a}
  .resumen .caras{display:flex;justify-content:space-around;margin-top:8px;padding-top:8px;border-top:1px dashed #d4e4db}
  .resumen .caras div{text-align:center;font-size:22px;line-height:1.1}
  .resumen .caras small{display:block;font-size:12px;color:#6b8f80}
  #det{display:none;background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
  #det .fe{font-size:14px;color:#6b8f80;text-transform:capitalize}
  #det .an{display:flex;align-items:center;gap:10px;margin:6px 0}
  #det .an .e{font-size:40px;line-height:1}
  #det .an .t{font-size:19px;font-weight:bold}
  #det .dep{font-size:14px;line-height:1.6;white-space:pre-line;border-top:1px dashed #d4e4db;padding-top:8px;margin-top:6px}
  #det .nota{font-size:14px;color:#6b8f80;font-style:italic;white-space:pre-wrap;margin-top:8px}
  #det .vac{font-size:14px;color:#6b8f80}
  .enl{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .enl a,.enl button{background:#fff;color:#2f8f6b;border:2px solid #2f8f6b;border-radius:14px;padding:10px 18px;font-size:14px;text-decoration:none;font-family:inherit}
  .enl button{background:#2f8f6b;color:#fff}
</style>
</head>
<body>
<div class="app">
  <h1>📅 Registro de Alba</h1>
  <p class="nube" id="nube"></p>

  <div class="nav">
    <button id="ant" aria-label="Mes anterior">‹</button>
    <div id="mes"></div>
    <button id="sig" aria-label="Mes siguiente">›</button>
  </div>
  <div class="sem"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
  <div class="cal" id="cal"></div>
  <div class="leyenda">
    <span>🏅 deporte</span><span>😴 sin deporte</span><span>📝 nota</span><span>┄ sin rellenar</span>
  </div>

  <div id="det"></div>

  <h2>Resumen del mes</h2>
  <div class="resumen" id="res"></div>

  <div class="enl">
    <a href="ver.html">👀 Vista</a>
    <a href="index.html">🦖 DinoDía</a>
    <button id="rec">Actualizar</button>
  </div>
</div>

<script>
const API="https://api.github.com/repos/qaswed441/dinodia-datos/contents/alba.json";
const ANIMOS=[{e:"😄",t:"Genial"},{e:"🙂",t:"Bien"},{e:"😐",t:"Regular"},{e:"😕",t:"Mal"},{e:"😢",t:"Muy mal"}];
const SP=[["💪","Tren superior"],["🏃","Tren inferior"],["❤️","Cardio"],["🧗","Escalada"],["🏊","Natación"],["🚶","Paseo largo"],["⭐","Específico"],["🦵","Piernas musculatura"],["🤲","Kong manos"]];
const PUNTOS=["","●","●●","●●●"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

try{const h=new URLSearchParams(location.hash.slice(1));const x=h.get("t");
  if(x){localStorage.setItem("dinodia_tk",x);history.replaceState(null,"",location.pathname+location.search);}}catch(e){}

const $=id=>document.getElementById(id);
const tk=()=>{try{return localStorage.getItem("dinodia_tk")}catch(e){return null}};
const deb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const k=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pf=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const estado=t=>{$("nube").textContent=t};
const norm=v=>{
  if(typeof v==="number") return ANIMOS[v]?{a:v,d:{},n:"",nd:0}:null;
  if(v&&typeof v==="object"&&ANIMOS[v.a]) return {a:v.a,d:v.d||{},n:v.n||"",nd:v.nd?1:0};
  return null;
};
function normTodo(crudo){const o={};Object.keys(crudo||{}).forEach(x=>{const r=norm(crudo[x]);if(r) o[x]=r;});return o;}
function local(){try{return normTodo(JSON.parse(localStorage.getItem("dinodia_v1")||"{}"))}catch(e){return {}}}

function hizoDeporte(r){return !r.nd&&SP.some((s,i)=>r.d[i]&&(r.d[i].m||r.d[i].t));}
function textoDeporte(r){
  if(r.nd) return "😴 Sin deporte";
  const partes=[];
  SP.forEach((s,i)=>{
    const dd=r.d[i]; if(!dd) return;
    const fr=[];
    if(dd.m) fr.push("☀️ "+PUNTOS[dd.m]);
    if(dd.t) fr.push("🌙 "+PUNTOS[dd.t]);
    if(fr.length) partes.push(s[0]+" "+s[1]+": "+fr.join(" · "));
  });
  return partes.join("\n");
}

const hoy=new Date();hoy.setHours(0,0,0,0);
let datos={},vy=hoy.getFullYear(),vm=hoy.getMonth(),sel=null;

function detalle(){
  const box=$("det");
  if(!sel){box.style.display="none";return;}
  const r=datos[sel],f=pf(sel);
  box.style.display="block";
  box.innerHTML="";
  const fe=document.createElement("div");fe.className="fe";
  fe.textContent=f.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  box.appendChild(fe);
  if(!r){
    const v=document.createElement("div");v.className="vac";v.style.marginTop="6px";
    v.textContent=f>hoy?"Todavía no ha llegado este día.":"Alba no rellenó este día.";
    box.appendChild(v);return;
  }
  const an=document.createElement("div");an.className="an";
  const e=document.createElement("span");e.className="e";e.textContent=ANIMOS[r.a].e;
  const t=document.createElement("span");t.className="t";t.textContent=ANIMOS[r.a].t;
  an.appendChild(e);an.appendChild(t);box.appendChild(an);
  const tx=textoDeporte(r);
  if(tx){const d=document.createElement("div");d.className="dep";d.textContent=tx;box.appendChild(d);}
  else{const d=document.createElement("div");d.className="vac";d.textContent="Deporte: sin rellenar";box.appendChild(d);}
  if(r.n){const n=document.createElement("div");n.className="nota";n.textContent="📝 "+r.n;box.appendChild(n);}
}

function resumen(){
  const hastaDia=(vy===hoy.getFullYear()&&vm===hoy.getMonth())?hoy.getDate():
    (new Date(vy,vm,1)>hoy?0:new Date(vy,vm+1,0).getDate());
  let reg=0,dep=0,desc=0,notas=0;const moods=[0,0,0,0,0];
  const nd=new Date(vy,vm+1,0).getDate();
  for(let i=1;i<=nd;i++){
    const r=datos[k(new Date(vy,vm,i))]; if(!r) continue;
    reg++;moods[r.a]++;
    if(r.nd) desc++; else if(hizoDeporte(r)) dep++;
    if(r.n) notas++;
  }
  const box=$("res");box.innerHTML="";
  const fila=(a,b)=>{const d=document.createElement("div");d.className="fila";
    const s=document.createElement("span");s.textContent=a;const bb=document.createElement("b");bb.textContent=b;
    d.appendChild(s);d.appendChild(bb);box.appendChild(d);};
  fila("📅 Días rellenados",reg+" de "+hastaDia);
  fila("🏅 Días con deporte",dep);
  fila("😴 Días sin deporte",desc);
  fila("📝 Días con nota",notas);
  const c=document.createElement("div");c.className="caras";
  ANIMOS.forEach((a,i)=>{const d=document.createElement("div");d.textContent=a.e;
    const s=document.createElement("small");s.textContent=moods[i];d.appendChild(s);c.appendChild(d);});
  box.appendChild(c);
}

function pintar(){
  $("mes").textContent=MESES[vm]+" "+vy;
  $("sig").disabled=(vy===hoy.getFullYear()&&vm===hoy.getMonth());
  const cal=$("cal");cal.innerHTML="";
  const off=(new Date(vy,vm,1).getDay()+6)%7;
  const nd=new Date(vy,vm+1,0).getDate();
  for(let i=0;i<off;i++){const x=document.createElement("div");x.className="dia fuera";cal.appendChild(x);}
  for(let i=1;i<=nd;i++){
    const f=new Date(vy,vm,i),key=k(f),r=datos[key];
    const b=document.createElement("button");
    let cl="dia";
    if(r) cl+=" m"+r.a; else if(f>hoy) cl+=" fut"; else cl+=" falta";
    if(f.getTime()===hoy.getTime()) cl+=" hoy";
    if(key===sel) cl+=" sel";
    b.className=cl;
    const n=document.createElement("span");n.className="n";n.textContent=i;
    const e=document.createElement("span");e.className="e";e.textContent=r?ANIMOS[r.a].e:"·";
    const ic=document.createElement("span");ic.className="ic";
    if(r) ic.textContent=(r.nd?"😴":hizoDeporte(r)?"🏅":"")+(r.n?"📝":"");
    b.appendChild(n);b.appendChild(e);b.appendChild(ic);
    b.onclick=()=>{sel=(sel===key)?null:key;pintar();detalle();};
    cal.appendChild(b);
  }
  resumen();
}

function mover(d){
  vm+=d;if(vm<0){vm=11;vy--;}if(vm>11){vm=0;vy++;}
  sel=null;pintar();detalle();
}
$("ant").onclick=()=>mover(-1);
$("sig").onclick=()=>{if(!$("sig").disabled) mover(1);};

async function cargar(){
  const t=tk();
  if(!t){datos=local();pintar();detalle();estado("Sin token: se muestran solo los datos de este dispositivo");return;}
  estado("Cargando…");
  try{
    const r=await fetch(API,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"},cache:"no-store"});
    if(r.status===404){datos=local();pintar();detalle();estado("Aún no hay registros en la nube");return;}
    if(!r.ok) throw r.status;
    const j=await r.json();
    datos=normTodo(JSON.parse(deb64(j.content)));
    pintar();detalle();
    estado("☁️ Actualizado a las "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    datos=local();pintar();detalle();
    estado(e===401||e===403?"⚠️ Token no válido o caducado (error "+e+")":"📴 Sin conexión: datos de este dispositivo");
  }
}
$("rec").onclick=cargar;
pintar();
cargar();
</script>
</body>
</html>
