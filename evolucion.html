<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinoDía · Evolución</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:#fff;min-height:100vh;background-color:#0B1330;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 80px,#cfe3ff,transparent),radial-gradient(ellipse at 50% 0%,#24378A,#0B1330 70%);background-size:140px 120px,170px 150px,100% 100%;background-attachment:fixed}
  .app{max-width:460px;margin:0 auto;padding:18px 16px 40px}
  h1{margin:4px 0 0;font-size:24px;text-align:center}
  h2{font-size:16px;margin:0 0 6px}
  .nube{margin:4px 0 12px;font-size:12px;color:#B8C4F0;text-align:center;min-height:15px}
  .c{background:#16224F;border:2px solid #3A4C99;border-radius:16px;padding:12px 14px;margin:12px 0}
  .m{font-size:13px;color:#B8C4F0;line-height:1.4}
  .big{font-size:24px;font-weight:bold}
  .barra{height:12px;border-radius:99px;background:#0B1330;overflow:hidden;margin:8px 0 4px}
  .barra i{display:block;height:100%;border-radius:99px}
  .r{margin:8px 0}.r span{font-size:14px;font-weight:bold}.r em{float:right;font-style:normal;font-size:12px;color:#B8C4F0}
  .b{height:8px;border-radius:99px;background:#0B1330;overflow:hidden;margin-top:3px}.b i{display:block;height:100%;border-radius:99px}
  .ch{display:inline-block;background:#0B1330;border:2px solid #3A4C99;border-radius:99px;padding:5px 11px;margin:3px 3px 0 0;font-size:13px}.ch.ok{border-color:#8FE3B0}
  .enl{display:block;width:fit-content;margin:16px auto 0;background:#4FC3F7;color:#0B1330;border:0;border-radius:14px;padding:12px 28px;font-size:16px;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <h1>📈 Mi evolución</h1>
  <p class="nube" id="nube"></p>
  <div id="out"></div>
  <a class="enl" href="#" onclick="history.back();return false">Volver</a>
</div>
<script src="jedi.js"></script>
<script>
const API="https://api.github.com/repos/qaswed441/dinodia-datos/contents/alba.json";
const ANI=["Genial","Bien","Regular","Mal","Muy mal"],COL=["#8FE3B0","#4FC3F7","#FFD54F","#FFB74D","#FF8A80"];
try{const h=new URLSearchParams(location.hash.slice(1));const x=h.get("t");
  if(x){localStorage.setItem("dinodia_tk",x);history.replaceState(null,"",location.pathname+location.search);}}catch(e){}
const $=id=>document.getElementById(id);
const tk=()=>{try{return localStorage.getItem("dinodia_tk")}catch(e){return null}};
const deb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const estado=t=>{$("nube").textContent=t};
const norm=v=>{
  if(typeof v==="number") return ANI[v]?{a:v,t:0}:null;
  if(v&&typeof v==="object"&&ANI[v.a]) return {a:v.a,t:v.t||0,d:v.d||{},n:v.n||"",nd:v.nd?1:0};
  return null;
};
const W=340,H=130,L=26,B=22,T=8;
function graf(vals,labs,max,tipo,col,meta){
  const n=vals.length,pw=(W-L-6)/Math.max(n,1),y=v=>T+(H-T-B)*(1-Math.min(v,max)/max),xs=i=>L+pw*(i+.5);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  [0,.5,1].forEach(f=>{const yy=y(max*f);s+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2A3A78"/><text x="'+(L-4)+'" y="'+(yy+4)+'" text-anchor="end" fill="#B8C4F0" font-size="10">'+Math.round(max*f)+'</text>';});
  if(meta!=null)s+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y(meta)+'" y2="'+y(meta)+'" stroke="'+col+'" stroke-dasharray="4 3" opacity=".7"/>';
  if(tipo==="l")s+='<polyline fill="none" stroke="'+col+'" stroke-width="3" points="'+vals.map((v,i)=>xs(i)+","+y(v)).join(" ")+'"/>'+vals.map((v,i)=>'<circle cx="'+xs(i)+'" cy="'+y(v)+'" r="4" fill="'+col+'"/>').join("");
  else s+=vals.map((v,i)=>'<rect x="'+(xs(i)-pw*.3)+'" y="'+y(v)+'" width="'+pw*.6+'" height="'+(y(0)-y(v))+'" rx="3" fill="'+col+'"/>').join("");
  labs.forEach((t,i)=>{if(n<=8||(n-1-i)%2===0)s+='<text x="'+xs(i)+'" y="'+(H-6)+'" text-anchor="middle" fill="#B8C4F0" font-size="10">'+t+'</text>';});
  return s+"</svg>";
}
function animo(datos){
  const J=JEDI,ini=J.add(J.lunes(new Date()),-49),N=56;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img">';
  [[0,"Genial"],[2,"Regular"],[4,"Muy mal"]].forEach(a=>{const yy=T+a[0]*24;s+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2A3A78"/><text x="'+(L-4)+'" y="'+(yy+4)+'" text-anchor="end" fill="#B8C4F0" font-size="8">'+a[1]+'</text>';});
  for(let i=0;i<N;i++){const r=datos[J.kd(J.add(ini,i))];if(r)s+='<circle cx="'+(L+(W-L-6)*(i+.5)/N)+'" cy="'+(T+r.a*24)+'" r="3.5" fill="'+COL[r.a]+'"/>';}
  return s+"</svg>";
}
const lab=w=>+w.slice(8)+"/"+ +w.slice(5,7);
const card=(t,h)=>'<div class="c"><h2>'+t+'</h2>'+h+'</div>';

function pintar(crudo){
  const datos={};
  Object.keys(crudo).forEach(x=>{const r=norm(crudo[x]);if(r)datos[x]=r;});
  const J=crudo.jedi,o=$("out");
  if(!window.JEDI||!J||!J.inicio){o.innerHTML=card("Todavía no hay evolución","<div class='m'>Alba aún no ha empezado el camino Jedi. Cuando lo haga, aquí verás cómo va creciendo su Fuerza.</div>");return;}
  const R=JEDI.R,UM=JEDI.UM,NS=JEDI.NS,P=JEDI.P,s=JEDI.calc(datos,J),r=s.rango,t=JEDI.tendencia(s);
  const ks=Object.keys(s.sem).sort().slice(-12),ws=ks.map(w=>s.sem[w]),labs=ks.map(lab),col=R[r][1];
  const cu=s.cur||{p:{f:0,v:0,h:0,e:0,s:0,d:0}};
  const pct=r<5?Math.round(Math.min(1,(s.ok+Math.min(cu.p.f/UM[r],1))/NS[r])*100):100;
  const sig=r<5?"Siguiente: "+R[r+1][0]+" · Fuerza "+UM[r]+" o más en "+NS[r]+" semana"+(NS[r]>1?"s":"")+" (lleva "+s.ok+")":"Ha llegado a lo más alto.";
  let h=card(R[r][0],'<div class="barra"><i style="width:'+pct+'%;background:'+col+'"></i></div><div class="m">'+sig+'</div><div class="m">Equilibrio: <b>'+s.eq+'</b> días (mejor: '+s.mejor+')</div>');
  h+=card("Fuerza semanal",graf(ws.map(x=>x.p.f),labs,100,"l",col,r<5?UM[r]:null)+'<div class="m"><b style="color:'+t[1]+'">'+t[0]+'</b>. La línea de puntos es la Fuerza que cuenta para el siguiente rango. La última semana sigue en curso.</div>');
  h+=card("Días registrados por semana",graf(ws.map(x=>x.c.reg),labs,7,"b","#4FC3F7",5)+'<div class="m">La meta son 5 días.</div>');
  h+=card("Deporte",graf(ws.map(x=>x.c.dep),labs,7,"b","#8FE3B0",4)+'<div class="m">Días con deporte (meta: 4).</div>'+graf(ws.map(x=>x.c.min),labs,Math.max(150,...ws.map(x=>x.c.min)),"b","#B388FF",150)+'<div class="m">Minutos por semana (meta: 150).</div>');
  h+=card("Ánimo, últimas 8 semanas",animo(datos)+'<div class="m">Cada punto es un día registrado.</div>');
  const prev=ks.filter(w=>!s.sem[w].prov).slice(-1).map(w=>s.sem[w])[0];
  h+=card("Las 5 pruebas: esta semana y la anterior",P.map(p=>{
    const a=Math.round(cu.p[p[1]]/p[2]*100),b=prev?Math.round(prev.p[p[1]]/p[2]*100):0;
    return '<div class="r"><span>'+p[0]+'</span><em>'+Math.round(cu.p[p[1]]*10)/10+' / '+p[2]+'</em><div class="b"><i style="width:'+a+'%;background:'+col+'"></i></div><div class="b"><i style="width:'+b+'%;background:#5A6AA8"></i></div></div>';
  }).join("")+'<div class="m">Barra de color: esta semana. Barra gris: la anterior.</div>');
  h+=card("Ascensos y logros",(s.asc.length?s.asc.map(a=>'<div class="m">⚔️ '+R[a.r][0]+' · semana del '+lab(a.w)+'</div>').join(""):'<div class="m">El primer ascenso está cerca.</div>')+'<div>'+JEDI.logros(s).map(l=>'<span class="ch'+(l[1]?" ok":"")+'">'+(l[1]?"✓ ":"? ")+l[0]+'</span>').join("")+'</div>');
  o.innerHTML=h;
}
async function cargar(){
  const t=tk();
  if(!t){estado("Falta el token: abre el enlace completo con #t=...");return;}
  estado("Cargando…");
  try{
    const r=await fetch(API,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json"},cache:"no-store"});
    if(!r.ok)throw r.status;
    const j=await r.json();
    pintar(JSON.parse(deb64(j.content)));
    estado("☁️ Actualizado a las "+new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){estado(e===401||e===403?"⚠️ Token no válido o caducado (error "+e+")":"📴 Sin conexión");}
}
cargar();
</script>
</body>
</html>
