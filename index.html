<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinoDía</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#d9f2e6,#fdf6e3);color:#2d4a3e;min-height:100vh}
  .app{max-width:460px;margin:0 auto;padding:18px 16px 40px;text-align:center}
  h1{margin:4px 0 0;font-size:26px;color:#2f8f6b;letter-spacing:1px}
  .sub{margin:0;font-size:13px;color:#6b8f80}
  .nube{margin:2px 0 6px;font-size:11px;color:#6b8f80;min-height:14px}
  #dino{width:210px;height:210px;margin:0 auto;display:block;animation:flota 3s ease-in-out infinite}
  @keyframes flota{50%{transform:translateY(-6px)}}
  .burbuja{background:#fff;border-radius:18px;padding:12px 16px;margin:6px 6px 14px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.08);position:relative;min-height:48px}
  .burbuja:before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
  h2{font-size:16px;margin:16px 0 8px}
  .caras{display:flex;justify-content:space-between;gap:6px}
  .cara{flex:1;background:#fff;border:3px solid transparent;border-radius:16px;padding:8px 0;font-size:30px;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .15s}
  .cara small{display:block;font-size:10px;color:#6b8f80;margin-top:2px}
  .cara.sel{border-color:#2f8f6b;transform:scale(1.1);background:#eafaf2}
  #editdep{display:none;margin:12px auto 0;background:#fff;color:#2f8f6b;border:2px solid #2f8f6b;border-radius:14px;padding:10px 20px;font-size:15px}
  .racha{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .tarjeta{background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 2px 6px rgba(0,0,0,.08);flex:1}
  .tarjeta b{display:block;font-size:26px;color:#e8833a}
  .tarjeta span{font-size:12px;color:#6b8f80}
  .dato{background:#fff;border-radius:16px;padding:12px 16px;margin-top:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);font-size:14px;line-height:1.4;text-align:left}
  .dato b{display:block;color:#e8833a;font-size:13px;margin-bottom:3px}
  .semana{display:flex;justify-content:space-between;gap:4px}
  .dsem{flex:1;background:#fff;border-radius:12px;padding:6px 0;font-size:20px}
  .dsem small{display:block;font-size:10px;color:#6b8f80}
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1;background:#fff;border:2px solid #cfe0d7;border-radius:12px;padding:9px 4px;font-size:14px;color:#2d4a3e}
  .tabs button.on{background:#2f8f6b;border-color:#2f8f6b;color:#fff;font-weight:bold}
  .grid50{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .cel{background:#fff;border-radius:12px;aspect-ratio:1;padding:2px;box-shadow:0 2px 5px rgba(0,0,0,.07)}
  .cel svg{width:100%;height:100%;display:block}
  .cel.bloq{background:#e3ece7;display:flex;align-items:center;justify-content:center;font-size:22px;color:#a5b8ae;box-shadow:none}
  .cel.real{aspect-ratio:auto;position:relative;padding:4px 4px 6px}
  .cel.real svg{height:auto;background:linear-gradient(#e9f7ff 60%,#d8efc9 60%);border-radius:10px}
  .cel.real small{display:block;font-size:11px;margin-top:3px}
  .cel.real .pin{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:#e8833a;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .cel.bloq.real{min-height:110px}
  #aviso{position:fixed;left:0;right:0;bottom:20px;text-align:center;display:none;z-index:60}
  #aviso span{background:#2f8f6b;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px}
  #fx{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40}
  #modal .caja{background:#fff;border-radius:22px;padding:18px;width:90%;max-width:360px;max-height:92vh;overflow:auto}
  #mtit{font-size:17px;font-weight:bold;color:#2f8f6b}
  #mdino{width:220px;height:220px;display:block;margin:6px auto;animation:flota 3s ease-in-out infinite}
  #mnom{font-size:22px;font-weight:bold}
  #mnum{font-size:13px;color:#6b8f80;margin-bottom:12px}
  #mtab{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:14px;text-align:left}
  #mtab td{padding:5px 0;border-bottom:1px dashed #d4e4db;vertical-align:top}
  #mtab td:first-child{color:#6b8f80;width:36%}
  #mcur{display:none;background:#fff1d6;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;text-align:left;margin-bottom:12px}
  #mok{background:#2f8f6b;color:#fff;border:0;border-radius:14px;padding:12px 30px;font-size:16px}
  /* pantalla de deporte */
  #dep{position:fixed;inset:0;background:linear-gradient(#d9f2e6,#fdf6e3);overflow:auto;display:none;z-index:30}
  #dep .in{max-width:460px;margin:0 auto;padding:18px 16px 110px}
  #dep h2{font-size:20px;color:#2f8f6b;text-align:center;margin:6px 0 2px}
  #dem{text-align:center;font-size:15px;color:#6b8f80;margin-bottom:12px}
  .ayuda{font-size:12px;color:#6b8f80;text-align:center;margin:0 0 10px}
  .fila{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid transparent;border-radius:14px;padding:8px 10px;margin-bottom:6px;box-shadow:0 2px 5px rgba(0,0,0,.06)}
  .fila.on{border-color:#2f8f6b;background:#eafaf2}
  .fila .nom{flex:1;text-align:left;font-size:14px}
  .fr{width:92px;background:#fff;border:2px solid #cfe0d7;border-radius:10px;padding:8px 2px;font-size:12px;color:#2d4a3e}
  .fr.on{background:#2f8f6b;border-color:#2f8f6b;color:#fff;font-weight:bold}
  #nod{width:100%;background:#fff;border:2px solid #cfe0d7;border-radius:14px;padding:12px;font-size:15px;margin:6px 0 10px;color:#2d4a3e}
  #nod.on{background:#2f8f6b;border-color:#2f8f6b;color:#fff;font-weight:bold}
  #nota{width:100%;height:80px;border:2px solid #cfe0d7;border-radius:14px;padding:10px;font-size:15px;font-family:inherit}
  .barra{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 16px;background:linear-gradient(transparent,#fdf6e3 35%)}
  #listo{display:block;width:100%;max-width:428px;margin:0 auto;background:#2f8f6b;color:#fff;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <h1>🦖 DinoDía</h1>
  <p class="sub" id="fecha"></p>
  <p class="nube" id="nube"></p>
  <svg id="dino" viewBox="0 0 200 200"></svg>
  <div class="burbuja" id="msg"></div>

  <h2>¿Cómo te sientes hoy?</h2>
  <div class="caras" id="caras"></div>
  <button id="editdep">✏️ Deporte de hoy</button>

  <div class="racha">
    <div class="tarjeta"><b id="racha">0</b><span>días seguidos</span></div>
    <div class="tarjeta"><b id="total">0</b><span>días en total</span></div>
  </div>

  <div class="dato" id="dato"></div>

  <h2>Tu semana</h2>
  <div class="semana" id="semana"></div>

  <h2>Tus dinos</h2>
  <div class="tabs">
    <button id="tabT" class="on">🐣 Tiernos <span id="cT"></span></button>
    <button id="tabR">🦴 Realistas <span id="cR"></span></button>
  </div>
  <div class="grid50" id="coleccion"></div>
  <div class="grid2" id="colreal" style="display:none"></div>
</div>

<div id="dep"><div class="in">
  <h2>¿Qué deporte has hecho?</h2>
  <div id="dem"></div>
  <p class="ayuda">Pulsa ☀️ o 🌙 para marcar la intensidad: ● leve · ●● media · ●●● fuerte · otra pulsación lo quita.</p>
  <div id="lsp"></div>
  <button id="nod">😴 No he hecho deporte</button>
  <textarea id="nota" placeholder="Notas (opcional)"></textarea>
</div>
<div class="barra"><button id="listo">¡Listo!</button></div></div>

<div id="modal"><div class="caja">
  <div id="mtit"></div>
  <svg id="mdino" viewBox="0 0 200 200"></svg>
  <div id="mnom"></div><div id="mnum"></div>
  <table id="mtab"></table>
  <div id="mcur"></div>
  <button id="mok">¡Genial!</button>
</div></div>
<div id="aviso"><span id="avisotxt"></span></div>

<script>
const ANIMOS=[{e:"😄",t:"Genial"},{e:"🙂",t:"Bien"},{e:"😐",t:"Regular"},{e:"😕",t:"Mal"},{e:"😢",t:"Muy mal"}];
const SP=[["💪","Tren superior"],["🏃","Tren inferior"],["❤️","Cardio"],["🧗","Escalada"],["🏊","Natación"],["🚶","Paseo largo"],["⭐","Específico"],["🦵","Piernas musculatura"],["🤲","Kong manos"]];
const PUNTOS=["","●","●●","●●●"];
const MSG=[
 ["¡Qué alegría verte así! Hoy brillas más que un volcán en erupción 🌋","¡Rexi está bailando de contenta! Disfruta este día 💚"],
 ["Qué bien que hoy estés bien. Rexi se queda a tu lado 🦕","Un día tranquilo también es un tesoro. Cuídate mucho 💚"],
 ["Hay días así, y está bien. Rexi te acompaña, sin prisa 🌿","Tómatelo con calma hoy. Lo estás haciendo muy bien 💚"],
 ["Lo siento mucho. Rexi te da un abrazo dinosaurio, grande y suave 🤗","Hoy toca ir despacito. Descansa todo lo que necesites 💚"],
 ["Rexi está contigo, aunque sea un día muy duro 💚 Respira hondo, aquí no estás sola.","Un abrazo enorme. Mañana será otro día y Rexi seguirá aquí 🦕"]
];
const DATOS=[
 "Los primeros dinosaurios aparecieron hace unos 230 millones de años.",
 "Las aves de hoy descienden de dinosaurios terópodos. ¡Un gorrión es un dinosaurio muy pequeño!",
 "La palabra «dinosaurio» significa «lagarto terrible».",
 "Muchos dinosaurios carnívoros tenían plumas, como el Velociraptor.",
 "El Velociraptor era del tamaño de un pavo grande, mucho más pequeño que en las películas.",
 "Los dinosaurios ponían huevos, y algunos cuidaban el nido, como el Maiasaura («buena madre lagarto»).",
 "Los pterodáctilos y los pterosaurios volaban, pero técnicamente no eran dinosaurios.",
 "El Spinosaurus, con su gran vela en la espalda, probablemente cazaba peces.",
 "El Estegosaurio tenía un cerebro muy pequeño para su tamaño.",
 "Se han encontrado fósiles de dinosaurios en todos los continentes, incluida la Antártida.",
 "Los dinosaurios se extinguieron hace unos 66 millones de años. Las personas llegaron muchísimo después.",
 "Algunos dinosaurios gigantes, como el Argentinosaurus, superaban los 30 metros según ciertas estimaciones.",
 "El Anquilosaurio tenía una maza de hueso en la cola para defenderse.",
 "El Parasaurolofus tenía una cresta hueca que probablemente usaba para hacer sonidos."
];
const MOUTH=[
 '<path d="M80 98 Q100 124 120 98 Z" fill="#7a2f2f" stroke="#3b2a2a" stroke-width="3" stroke-linejoin="round"/>',
 '<path d="M84 100 Q100 114 116 100" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>',
 '<path d="M88 106 L112 106" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>',
 '<path d="M86 110 Q100 98 114 110" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>',
 '<path d="M86 112 Q100 98 114 112" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/><path d="M80 82 Q76 94 82 98 Q88 94 84 84 Z" fill="#7ec8ff"/>'
];
function rexi(m){
  const ojos = m===0
    ? '<path d="M74 82 Q82 72 90 82" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/><path d="M110 82 Q118 72 126 82" fill="none" stroke="#3b2a2a" stroke-width="4" stroke-linecap="round"/>'
    : '<circle cx="82" cy="80" r="7" fill="#3b2a2a"/><circle cx="118" cy="80" r="7" fill="#3b2a2a"/><circle cx="84" cy="77" r="2.5" fill="#fff"/><circle cx="120" cy="77" r="2.5" fill="#fff"/>';
  const cejas = m>=3
    ? '<path d="M72 68 L90 72" stroke="#3b2a2a" stroke-width="3" stroke-linecap="round"/><path d="M128 68 L110 72" stroke="#3b2a2a" stroke-width="3" stroke-linecap="round"/>' : '';
  return `
  <path d="M150 140 Q190 150 185 180 Q160 165 140 165 Z" fill="#43b58a"/>
  <polygon points="60,60 72,30 84,52" fill="#f0a35e"/>
  <polygon points="88,48 100,18 112,48" fill="#f0a35e"/>
  <polygon points="116,52 128,30 140,60" fill="#f0a35e"/>
  <ellipse cx="100" cy="140" rx="55" ry="45" fill="#56c79a"/>
  <ellipse cx="100" cy="152" rx="34" ry="30" fill="#c8f0dc"/>
  <circle cx="100" cy="88" r="46" fill="#56c79a"/>
  <rect x="68" y="172" width="22" height="16" rx="8" fill="#43b58a"/>
  <rect x="110" y="172" width="22" height="16" rx="8" fill="#43b58a"/>
  <circle cx="68" cy="98" r="7" fill="#ff9fb2" opacity=".6"/><circle cx="132" cy="98" r="7" fill="#ff9fb2" opacity=".6"/>
  ${ojos}${cejas}${MOUTH[m]}`;
}

/* ---------- 50 dinos tiernos ---------- */
const ESP=["T-Rex","Diplodocus","Tricerátops","Estegosaurio","Raptor","Anquilosaurio","Pterodáctilo","Espinosaurio","Parasaurolofus","Bebé dino"];
const NOM=["Pipo","Lola","Nube","Churro","Mimí","Toby","Canela","Bruno","Lúa","Fresa",
 "Nacho","Trufa","Kiwi","Perla","Otto","Miel","Coco","Pepe","Luna","Menta",
 "Bimba","Zeus","Tango","Piña","Max","Dulce","Gus","Alma","Bolita","Sol",
 "Nino","Gala","Rufo","Violeta","Mochi","Chispa","Tuli","Gloria","Pelusa","Rayo",
 "Oli","Bombón","Fito","Zoe","Mango","Lía","Duque","Cielo","Pompón","Estrella"];
const PAL=[["#56c79a","#43b58a","#c8f0dc"],["#6fb7f2","#4f9ad8","#d6ecff"],["#f4a261","#e08840","#ffe3c8"],["#c49bf0","#a87ad8","#ecdcff"],["#f58fb0","#e06f95","#ffdbe8"]];
function cara(x,y,r){
  return `<circle cx="${x-r*.38}" cy="${y-r*.05}" r="${r*.16}" fill="#3b2a2a"/><circle cx="${x+r*.38}" cy="${y-r*.05}" r="${r*.16}" fill="#3b2a2a"/>
  <circle cx="${x-r*.34}" cy="${y-r*.1}" r="${r*.06}" fill="#fff"/><circle cx="${x+r*.42}" cy="${y-r*.1}" r="${r*.06}" fill="#fff"/>
  <circle cx="${x-r*.68}" cy="${y+r*.28}" r="${r*.15}" fill="#ff9fb2" opacity=".6"/><circle cx="${x+r*.68}" cy="${y+r*.28}" r="${r*.15}" fill="#ff9fb2" opacity=".6"/>
  <path d="M${x-r*.25} ${y+r*.3} Q${x} ${y+r*.55} ${x+r*.25} ${y+r*.3}" fill="none" stroke="#3b2a2a" stroke-width="3" stroke-linecap="round"/>`;
}
function accesorio(v,x,y,r){
  if(v===0) return `<g><circle cx="${x+r*.62}" cy="${y-r*.78}" r="${r*.13}" fill="#ff7aa8"/><circle cx="${x+r*.62+r*.17}" cy="${y-r*.78}" r="${r*.13}" fill="#ff7aa8"/><circle cx="${x+r*.62-r*.17}" cy="${y-r*.78}" r="${r*.13}" fill="#ff7aa8"/><circle cx="${x+r*.62}" cy="${y-r*.78-r*.17}" r="${r*.13}" fill="#ff7aa8"/><circle cx="${x+r*.62}" cy="${y-r*.78+r*.17}" r="${r*.13}" fill="#ff7aa8"/><circle cx="${x+r*.62}" cy="${y-r*.78}" r="${r*.1}" fill="#ffd24d"/></g>`;
  if(v===1) return `<polygon points="${x-r*.5},${y-r*.85} ${x-r*.5},${y-r*1.3} ${x-r*.25},${y-r*1.05} ${x},${y-r*1.4} ${x+r*.25},${y-r*1.05} ${x+r*.5},${y-r*1.3} ${x+r*.5},${y-r*.85}" fill="#ffd24d" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/>`;
  if(v===2) return `<circle cx="${x-r*.38}" cy="${y-r*.05}" r="${r*.27}" fill="rgba(255,255,255,.35)" stroke="#3b2a2a" stroke-width="3"/><circle cx="${x+r*.38}" cy="${y-r*.05}" r="${r*.27}" fill="rgba(255,255,255,.35)" stroke="#3b2a2a" stroke-width="3"/><path d="M${x-r*.11} ${y-r*.05} L${x+r*.11} ${y-r*.05}" stroke="#3b2a2a" stroke-width="3"/>`;
  if(v===3){const bx=x-r*.7,by=y-r*.8;return `<polygon points="${bx},${by} ${bx-15},${by-10} ${bx-15},${by+10}" fill="#ff5d8f"/><polygon points="${bx},${by} ${bx+15},${by-10} ${bx+15},${by+10}" fill="#ff5d8f"/><circle cx="${bx}" cy="${by}" r="4" fill="#ff2f6d"/>`;}
  return `<polygon points="${x-r*.4},${y-r*.85} ${x+r*.4},${y-r*.85} ${x},${y-r*1.7}" fill="#6fb7f2" stroke="#4f9ad8" stroke-width="2" stroke-linejoin="round"/><circle cx="${x}" cy="${y-r*1.7}" r="5" fill="#ffd24d"/>`;
}
function dinoSVG(i){
  const sp=i%10, v=Math.floor(i/10), [c,d,b]=PAL[v], o="#f0a35e";
  let hx=100,hy=88,hr=40,pre="",post="";
  if(sp===0){hr=44;post=`<ellipse cx="62" cy="150" rx="8" ry="5" fill="${d}"/><ellipse cx="138" cy="150" rx="8" ry="5" fill="${d}"/><polygon points="${hx-12},${hy+hr*.38} ${hx-6},${hy+hr*.38+9} ${hx},${hy+hr*.38}" fill="#fff"/>`;}
  if(sp===1){hx=128;hy=50;hr=26;pre=`<rect x="114" y="56" width="28" height="92" rx="14" fill="${c}"/>`;}
  if(sp===2){hr=38;pre=`<circle cx="${hx}" cy="${hy}" r="${hr+15}" fill="${d}"/><circle cx="${hx-hr*.9}" cy="${hy-hr*.9}" r="4" fill="${o}"/><circle cx="${hx}" cy="${hy-hr-9}" r="4" fill="${o}"/><circle cx="${hx+hr*.9}" cy="${hy-hr*.9}" r="4" fill="${o}"/>`;
    post=`<polygon points="${hx-hr*.62},${hy-hr*.55} ${hx-hr*.9},${hy-hr*1.3} ${hx-hr*.3},${hy-hr*.75}" fill="#fff3d6" stroke="#e8dcc0" stroke-width="2"/><polygon points="${hx+hr*.62},${hy-hr*.55} ${hx+hr*.9},${hy-hr*1.3} ${hx+hr*.3},${hy-hr*.75}" fill="#fff3d6" stroke="#e8dcc0" stroke-width="2"/><polygon points="${hx-5},${hy-hr*.3} ${hx},${hy-hr*.7} ${hx+5},${hy-hr*.3}" fill="#fff3d6" stroke="#e8dcc0" stroke-width="2"/>`;}
  if(sp===3){hr=38;for(let j=0;j<5;j++){const x=62+j*19;pre+=`<polygon points="${x},125 ${x+10},82 ${x+20},125" fill="${o}"/>`;}
    post=`<polygon points="168,174 177,156 184,176" fill="${o}"/>`;}
  if(sp===4){hr=36;pre=[-28,0,28].map(a=>`<ellipse cx="${hx}" cy="${hy-hr-4}" rx="6" ry="15" fill="${o}" transform="rotate(${a} ${hx} ${hy})"/>`).join("");
    post=[70,100,130].map(x=>`<path d="M${x} 125 Q${x+5} 140 ${x} 152" stroke="${d}" stroke-width="5" fill="none" stroke-linecap="round"/>`).join("");}
  if(sp===5){pre=`<path d="M48 150 Q48 74 100 74 Q152 74 152 150Z" fill="${d}"/><circle cx="100" cy="86" r="8" fill="${o}"/><circle cx="76" cy="96" r="8" fill="${o}"/><circle cx="124" cy="96" r="8" fill="${o}"/>`;
    post=`<circle cx="186" cy="176" r="11" fill="${d}"/><polygon points="176,168 186,156 190,170" fill="${o}"/>`;}
  if(sp===6){pre=`<path d="M58 125 L6 82 L18 120 L4 132 L22 142 L58 150Z" fill="${d}"/><path d="M142 125 L194 82 L182 120 L196 132 L178 142 L142 150Z" fill="${d}"/><polygon points="${hx-6},${hy-hr+2} ${hx+hr},${hy-hr-10} ${hx+10},${hy-hr*.2}" fill="${o}"/>`;}
  if(sp===7){pre=`<path d="M50 130 Q58 52 100 66 Q142 52 150 130Z" fill="${o}"/><path d="M100 66 L100 120 M76 74 L80 120 M124 74 L120 120" stroke="${d}" stroke-width="3" fill="none"/>`;}
  if(sp===8){hr=38;pre=`<path d="M${hx-hr*.1} ${hy-hr*.8} Q${hx+hr*1.3} ${hy-hr*1.9} ${hx+hr*1.5} ${hy-hr*.1}" stroke="${d}" stroke-width="14" stroke-linecap="round" fill="none"/>`;}
  if(sp===9){hy=84;post=`<path d="M46 152 L60 138 L74 152 L88 138 L102 152 L116 138 L130 152 L144 138 L154 152 Q154 190 100 190 Q46 190 46 152Z" fill="#fffaf0" stroke="#e8dcc0" stroke-width="3" stroke-linejoin="round"/>`;}
  return `${pre}
  <path d="M148 140 Q190 150 186 182 Q162 166 140 166Z" fill="${d}"/>

/* ---------- datos ----------

   Los registros antiguos (un número) se convierten solos. */
const CLAVE="dinodia_v1";
const API="https://api.github.com/repos/qaswed441/dinodia-datos/contents/alba.json";
try{const h=new URLSearchParams(location.hash.slice(1));const x=h.get("t");
  if(x){localStorage.setItem("dinodia_tk",x);history.replaceState(null,"",location.pathname+location.search);}}catch(e){}
const norm=v=>{
  if(typeof v==="number") return ANIMOS[v]?{a:v,t:0}:null;
  if(v&&typeof v==="object"&&ANIMOS[v.a]) return {a:v.a,t:v.t||0,d:v.d||{},n:v.n||"",nd:v.nd?1:0};
  return null;
};
let datos={},sha=null;
try{
  const ld=JSON.parse(localStorage.getItem(CLAVE)||"{}");
  Object.keys(ld).forEach(x=>{const r=norm(ld[x]);if(r) datos[x]=r;});
}catch(e){datos={}}
const guardar=()=>{try{localStorage.setItem(CLAVE,JSON.stringify(datos))}catch(e){}};
const k=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const $=id=>document.getElementById(id);
const tk=()=>{try{return localStorage.getItem("dinodia_tk")}catch(e){return null}};
const pend=v=>{try{v?localStorage.setItem("dinodia_pend","1"):localStorage.removeItem("dinodia_pend")}catch(e){}};
const hayPend=()=>{try{return localStorage.getItem("dinodia_pend")==="1"}catch(e){return false}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const deb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
const cab=t=>({Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"});
const estado=t=>{$("nube").textContent=t};

  const t=tk(); if(!t) return;
  try{
    const r=await fetch(API,{headers:cab(t),cache:"no-store"});

    if(!r.ok) throw r.status;
    const j=await r.json(); sha=j.sha;
    const rem=JSON.parse(deb64(j.content));
    Object.keys(rem).forEach(x=>{
      const rr=norm(rem[x]); if(!rr) return;
      const l=datos[x];
      if(!l||(rr.t||0)>(l.t||0)) datos[x]=rr;
    });
    Object.keys(datos).forEach(x=>{
      const rr=norm(rem[x]);
      if(!rr||(rr.t||0)<(datos[x].t||0)) pend(1);
    });
    guardar(); pintar(); estado("☁️ Sincronizado");
  }catch(e){estado(e===401||e===403?"⚠️ Token no válido (error "+e+")":"📴 Sin conexión");}
}
async function subir(reint){
  const t=tk(); if(!t) return;
  try{
    const body={message:"registro "+k(new Date()),content:b64(JSON.stringify(datos,null,1))};
    if(sha) body.sha=sha;
    const r=await fetch(API,{method:"PUT",headers:cab(t),body:JSON.stringify(body)});
    if(r.ok){sha=(await r.json()).content.sha;pend(0);estado("☁️ Guardado");}
    else if((r.status===409||r.status===422)&&!reint){await bajar();await subir(true);}
    else throw r.status;
  }catch(e){estado(e===401||e===403||e===404?"⚠️ Sin permiso para guardar (error "+e+")":"📴 Pendiente de guardar");}
}

/* ---------- pantalla ---------- */
function racha(){
  let d=new Date();
  if(datos[k(d)]===undefined) d.setDate(d.getDate()-1);
  let n=0;
  while(datos[k(d)]!==undefined){n++;d.setDate(d.getDate()-1);}
  return n;
}
function aviso(t){$("avisotxt").textContent=t;$("aviso").style.display="block";setTimeout(()=>$("aviso").style.display="none",3000);}
function pestana(x){
  $("coleccion").style.display=x==="t"?"grid":"none";
  $("colreal").style.display=x==="r"?"grid":"none";
  $("tabT").className=x==="t"?"on":"";
  $("tabR").className=x==="r"?"on":"";
}
$("tabT").onclick=()=>pestana("t");
$("tabR").onclick=()=>pestana("r");
function pintar(){
  const hoy=new Date();
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  $("fecha").textContent="Hoy es "+dias[hoy.getDay()]+" "+hoy.getDate();
  const reg=datos[k(hoy)];
  const m=reg?reg.a:undefined;
  $("dino").innerHTML=rexi(m===undefined?1:m);
  $("msg").textContent=m===undefined?"¡Hola! Soy Rexi 🦖 ¿Cómo estás hoy?":MSG[m][hoy.getDate()%2];
  $("caras").innerHTML="";
  ANIMOS.forEach((a,i)=>{
    const b=document.createElement("button");
    b.className="cara"+(m===i?" sel":"");
    b.innerHTML=a.e+"<small>"+a.t+"</small>";
    b.onclick=()=>elegir(i);
    $("caras").appendChild(b);
  });
  $("editdep").style.display=reg?"block":"none";
  $("racha").textContent=racha();
  $("total").textContent=Object.keys(datos).length;
  const diaN=Math.floor((Date.now()-hoy.getTimezoneOffset()*60000)/86400000);
  $("dato").innerHTML="<b>🦴 Dato del día</b>"+DATOS[diaN%DATOS.length];
  $("semana").innerHTML="";
  const ini=["L","M","X","J","V","S","D"];
  const lunes=new Date();
  lunes.setDate(lunes.getDate()-((lunes.getDay()+6)%7));
  for(let i=0;i<7;i++){
    const d=new Date(lunes);d.setDate(lunes.getDate()+i);
    const v=datos[k(d)];
    const el=document.createElement("div");
    el.className="dsem";
    el.innerHTML=(v===undefined?"·":ANIMOS[v.a].e)+"<small>"+ini[i]+"</small>";
    if(k(d)===k(new Date())) el.style.outline="3px solid #2f8f6b";
    $("semana").appendChild(el);
  }
  const total=Object.keys(datos).length;
  const n=Math.min(total,50);
  $("cT").textContent="("+n+"/50)";
  const col=$("coleccion"); col.innerHTML="";
  for(let i=0;i<50;i++){
    const el=document.createElement("div");
    if(i<n){el.className="cel";el.innerHTML='<svg viewBox="0 0 200 200">'+dinoSVG(i)+'</svg>';el.onclick=()=>ver(i,false);}
    else{el.className="cel bloq";el.textContent="?";}
    col.appendChild(el);
  }
  const nR=Math.min(total,REALES.length);
  $("cR").textContent="("+nR+"/"+REALES.length+")";
  const cr=$("colreal"); cr.innerHTML="";
  REALES.forEach((d,i)=>{
    const el=document.createElement("div");
    if(i<nR){
      el.className="cel real";
      el.innerHTML='<div class="pin">🔍</div><svg viewBox="0 0 300 200">'+d.f(...d.pal)+'</svg><small>'+d.n+'</small>';
      el.onclick=()=>verReal(i,false);
    }else{el.className="cel bloq real";el.textContent="?";}
    cr.appendChild(el);
  });
}
function abrirModal(){
  $("modal").style.display="flex";
  $("modal").querySelector(".caja").scrollTop=0;
}
function ver(i,nuevo){
  $("mtit").textContent=nuevo?"🎉 ¡Nuevo amigo desbloqueado! 🎉":"Tu dino";
  const s=$("mdino");
  s.setAttribute("viewBox","0 0 200 200");
  s.style.width="220px";s.style.height="220px";s.style.background="none";
  s.innerHTML=dinoSVG(i);
  $("mnom").textContent=NOM[i]+" · "+ESP[i%10];
  $("mnum").textContent="Dino "+(i+1)+" de 50";
  $("mtab").innerHTML="";
  $("mcur").style.display="none";
  abrirModal();
}
function verReal(i,nuevo){
  const d=REALES[i];
  $("mtit").textContent=nuevo?"🎉 ¡Nuevo dino real! 🎉":"📖 Ficha";
  const s=$("mdino");
  s.setAttribute("viewBox","0 0 300 200");
  s.style.width="100%";s.style.height="auto";
  s.style.background="linear-gradient(#e9f7ff 60%,#d8efc9 60%)";s.style.borderRadius="14px";
  s.innerHTML=d.f(...d.pal);
  $("mnom").textContent=d.n;
  $("mnum").innerHTML="<i>"+d.lat+"</i>";
  $("mtab").innerHTML=
   "<tr><td>🧬 Grupo</td><td>"+d.g+"</td></tr>"+
   "<tr><td>🕰️ Época</td><td>"+d.epoca+"</td></tr>"+
   "<tr><td>🍽️ Dieta</td><td>"+d.dieta+"</td></tr>"+
   "<tr><td>📏 Tamaño</td><td>"+d.tam+"</td></tr>"+
   "<tr><td>🌍 Vivió en</td><td>"+d.zona+"</td></tr>";
  $("mcur").textContent="⭐ "+d.cur;
  $("mcur").style.display="block";
  abrirModal();
}
let cola=[];
$("mok").onclick=()=>{
  $("modal").style.display="none";
  if(cola.length){const f=cola.shift();setTimeout(f,300);}
};

function fuegos(){
  const cv=$("fx");cv.style.display="block";cv.width=innerWidth;cv.height=innerHeight;
  const g=cv.getContext("2d");let ps=[],t=0;
  const cols=["#ff5d5d","#ffd24d","#56c79a","#6fb7f2","#c49bf0","#ff9fb2"];
  const burst=(x,y)=>{for(let i=0;i<40;i++){const a=Math.random()*6.28,s=2+Math.random()*4;
    ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,c:cols[Math.floor(Math.random()*cols.length)]});}};
  (function loop(){
    g.clearRect(0,0,cv.width,cv.height);
    if(t%18===0&&t<70) burst(cv.width*(.2+Math.random()*.6),cv.height*(.2+Math.random()*.35));
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--;g.globalAlpha=Math.max(p.l/60,0);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,3,0,6.28);g.fill();});
    ps=ps.filter(p=>p.l>0);t++;
    if(t<150||ps.length) requestAnimationFrame(loop); else cv.style.display="none";
  })();
}

/* ---------- pantalla de deporte ---------- */
let edit=null;
function abrirDep(a){
  const ex=datos[k(new Date())];
  edit={
    a:a,
    nuevo:ex===undefined,
    d:ex?JSON.parse(JSON.stringify(ex.d||{})):{},
    n:ex?(ex.n||""):"",
    nd:ex?(ex.nd?1:0):0
  };
  $("dem").textContent=ANIMOS[a].e+" Hoy te sientes: "+ANIMOS[a].t;
  $("nota").value=edit.n;
  pintarDep();
  $("dep").style.display="block";
  $("dep").scrollTop=0;
}
function pintarDep(){
  const l=$("lsp"); l.innerHTML="";
  SP.forEach((s,i)=>{
    const dd=edit.d[i]||{};
    const fila=document.createElement("div");
    fila.className="fila"+((dd.m||dd.t)?" on":"");
    const nom=document.createElement("span");
    nom.className="nom"; nom.textContent=s[0]+" "+s[1];
    fila.appendChild(nom);
    [["m","☀️ Mañana"],["t","🌙 Tarde"]].forEach(([f,txt])=>{
      const b=document.createElement("button");
      b.className="fr"+(dd[f]?" on":"");
      b.textContent=txt+(dd[f]?" "+PUNTOS[dd[f]]:"");
      b.onclick=()=>{
        const v=((edit.d[i]&&edit.d[i][f])||0)+1;
        if(!edit.d[i]) edit.d[i]={};
        if(v>3) delete edit.d[i][f]; else edit.d[i][f]=v;
        if(!edit.d[i].m&&!edit.d[i].t) delete edit.d[i];
        edit.nd=0;
        pintarDep();
      };
      fila.appendChild(b);
    });
    l.appendChild(fila);
  });
  $("nod").className=edit.nd?"on":"";
}
$("nod").onclick=()=>{edit.d={};edit.nd=1;pintarDep();};
$("editdep").onclick=()=>{const r=datos[k(new Date())];if(r) abrirDep(r.a);};
function elegir(i){abrirDep(i);}
$("listo").onclick=()=>{
  const hk=k(new Date());
  const nuevo=datos[hk]===undefined;
  datos[hk]={a:edit.a,t:Date.now(),d:edit.d,n:$("nota").value.trim(),nd:edit.nd};
  guardar(); pend(1);
  $("dep").style.display="none";
  pintar();
  if(nuevo){
    fuegos();
    const n=Object.keys(datos).length;
    const lista=[];
    if(n<=50) lista.push(()=>ver(n-1,true)); else aviso("¡Ya tienes los 50 dinos! 🎉");
    if(n-1<REALES.length) lista.push(()=>verReal(n-1,true));
    cola=lista;
    if(cola.length) setTimeout(()=>{const f=cola.shift();f();},500);
  }
  subir();
};
window.addEventListener("online",()=>{if(hayPend()) subir();});
pintar();
if(tk()) bajar().then(()=>{if(hayPend()) subir();});
</script>
